<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Ivan Martinez">
  <title>Ivan Martinez</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d5cff" />
      <stop offset="1" stop-color="#1b33e8" />
    </linearGradient>
  </defs>
  <!-- Brand tile — 22% corner radius, matching the rounded-lg mark in the navbar -->
  <rect width="32" height="32" rx="7" fill="url(#tile)" />
  <!--
    IM monogram as filled outlines rather than text (no font dependency) and
    rather than strokes (miter joins on the M would spike past the cap height,
    leaving the letters misaligned). Sized to ~66% of the tile so the M's centre
    notch survives rasterisation down at 16px. Both letters span y 7.5–24.5.
  -->
  <g fill="#ffffff">
    <rect x="5.5" y="7.5" width="3.5" height="17" />
    <path d="M11.6 7.5 19.05 16.5 26.5 7.5v17H23v-7.285l-3.95 4.775-3.95-4.775V24.5h-3.5z" />
  </g>
</svg>
